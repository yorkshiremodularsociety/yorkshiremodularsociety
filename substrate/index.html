<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUBSTRATE — autonomous sound study</title>
<style>
:root{color-scheme:dark;--ink:#100e15;--plum:#302335;--violet:#72556c;--pearl:#c9b7d2;--muted:#918794;--line:rgba(201,183,210,.16)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:#d9cbd9;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh;overflow-x:hidden;overflow-y:auto;background:radial-gradient(ellipse at 53% 44%,#302335 0%,#1d1721 34%,#100e15 72%)}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.11;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E")}
main{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;padding:30px 34px 26px}.top{display:flex;align-items:flex-start;justify-content:space-between}.brand{font-size:13px;letter-spacing:.34em;font-weight:500}.sub{font-size:9px;letter-spacing:.18em;color:var(--muted);margin-top:9px;text-transform:uppercase}.status{font-size:9px;letter-spacing:.16em;color:#a99ba9;text-align:right;text-transform:uppercase}.field{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:clamp(250px,42svh,560px)}.orb{width:min(65vw,620px);aspect-ratio:1;border-radius:50%;position:relative;filter:blur(.2px);opacity:.72;background:radial-gradient(ellipse at 35% 37%,rgba(193,139,114,.22),transparent 19%),radial-gradient(ellipse at 62% 58%,rgba(129,156,152,.22),transparent 24%),radial-gradient(ellipse at 48% 48%,rgba(114,85,108,.55),rgba(48,35,53,.12) 48%,transparent 69%);animation:breathe 17s ease-in-out infinite alternate}
.orb:before,.orb:after{content:"";position:absolute;inset:8%;border:1px solid rgba(201,183,210,.14);border-radius:42% 58% 61% 39% / 48% 41% 59% 52%;transform:rotate(27deg);box-shadow:inset 0 0 70px rgba(201,183,210,.07),0 0 65px rgba(114,85,108,.12);animation:drift 29s ease-in-out infinite alternate}.orb:after{inset:19%;border-color:rgba(193,139,114,.16);border-radius:61% 39% 43% 57% / 40% 60% 40% 60%;transform:rotate(-38deg);animation-duration:23s;animation-direction:alternate-reverse}
@keyframes breathe{from{transform:scale(.92) rotate(-5deg);opacity:.5}to{transform:scale(1.06) rotate(6deg);opacity:.9}}@keyframes drift{from{transform:rotate(10deg) scale(.96)}to{transform:rotate(46deg) scale(1.04)}}
.hint{position:absolute;bottom:10%;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(201,183,210,.42)}.bottom{display:flex;align-items:flex-end;justify-content:space-between;border-top:1px solid var(--line);padding-top:17px}.readout{font-size:9px;line-height:1.8;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.controls{display:flex;gap:9px;align-items:center}button{font:inherit;color:#d9cbd9;background:transparent;border:1px solid var(--line);padding:11px 15px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}button:hover{border-color:rgba(201,183,210,.55);background:rgba(201,183,210,.05)}button.primary{border-color:rgba(201,183,210,.42)}button:disabled{opacity:.35;cursor:default}.note{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:rgba(201,183,210,.5);white-space:nowrap;pointer-events:none}
@media(max-width:600px){main{min-height:100svh;padding:20px 19px 18px}.field{min-height:clamp(250px,42svh,360px)}.orb{width:min(74vw,340px)}.bottom{gap:16px;align-items:flex-start;flex-direction:column}.controls{width:100%;flex-wrap:wrap}.controls button{flex:1}.status{max-width:120px;line-height:1.7}}
</style>
</head>
<body><div class="grain"></div><main>
<header class="top"><div><div class="brand">SUBSTRATE</div><div class="sub">Autonomous sound study / 01</div></div><div class="status" id="status">Dormant<br>Awaiting activation</div></header>
<section class="field" id="field"><div class="orb" id="orb"></div><div class="hint" id="hint">An environment without a score</div></section>
<footer class="bottom"><div class="readout" id="readout">SYSTEM / INACTIVE<br>ACTIVITY / —<br>STATE / UNOBSERVED</div><div class="controls"><button class="primary" id="start">Enter environment</button><button id="disturb" disabled>Disturb</button><button id="reseed" disabled>Reseed</button><button id="silence" disabled>Silence</button></div></footer>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);let ctx=null,master=null,convolver=null,delay=null,feedback=null,active=false,voices=[],timers=[],state={energy:.38,pressure:.22,activity:.2,phase:0,seed:Math.random()*1e6};let buffers={};
const files={substrate:'assets/01_substrate.wav',pressure:'assets/02_pressure.wav',circulation:'assets/03_circulation.wav',signal:'assets/04_signal.wav',resonance:'assets/05_resonance.wav'};
const rand=(a,b)=>a+Math.random()*(b-a);const choose=a=>a[Math.floor(Math.random()*a.length)];
function makeImpulse(seconds=8,decay=3.2){const len=Math.floor(ctx.sampleRate*seconds),ir=ctx.createBuffer(2,len,ctx.sampleRate);for(let c=0;c<2;c++){let d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}return ir}
async function init(){ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();master=ctx.createGain();master.gain.value=.7;const limiter=ctx.createDynamicsCompressor();limiter.threshold.value=-18;limiter.knee.value=18;limiter.ratio.value=3;limiter.attack.value=.02;limiter.release.value=.3;master.connect(limiter);limiter.connect(ctx.destination);convolver=ctx.createConvolver();convolver.buffer=makeImpulse();const wet=ctx.createGain();wet.gain.value=.48;convolver.connect(wet);wet.connect(master);delay=ctx.createDelay(8);delay.delayTime.value=2.7;feedback=ctx.createGain();feedback.gain.value=.24;const delayWet=ctx.createGain();delayWet.gain.value=.16;delay.connect(feedback);feedback.connect(delay);delay.connect(delayWet);delayWet.connect(master);const dryBus=ctx.createGain();dryBus.gain.value=.78;dryBus.connect(master);const wetBus=ctx.createGain();wetBus.gain.value=.68;wetBus.connect(convolver);wetBus.connect(delay);
for(const [key,url] of Object.entries(files)){const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw new Error('Could not load '+url+' ('+r.status+')');const data=await r.arrayBuffer();buffers[key]=await ctx.decodeAudioData(data)}await ctx.resume();
return {dryBus,wetBus};}
let buses;
function source(key,{rate=1,loop=false,start=0,duration=null,volume=.3,filter=1200,pan=0,attack=3,release=5,wet=.7}={}){if(!active||!buffers[key])return;const now=ctx.currentTime,src=ctx.createBufferSource(),gain=ctx.createGain(),f=ctx.createBiquadFilter(),p=ctx.createStereoPanner(),send=ctx.createGain();src.buffer=buffers[key];src.playbackRate.value=rate;src.loop=loop;f.type='lowpass';f.frequency.value=filter;f.Q.value=.65;p.pan.value=pan;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(Math.max(.001,volume),now+attack);const dur=duration??Math.min(buffers[key].duration-start,rand(12,35));gain.gain.setValueAtTime(Math.max(.001,volume),now+attack+Math.max(.1,dur-attack-release));gain.gain.exponentialRampToValueAtTime(.0001,now+dur);send.gain.value=wet;src.connect(f);f.connect(gain);gain.connect(send);send.connect(buses.wetBus);gain.connect(p);p.connect(buses.dryBus);src.start(now,start);src.stop(now+dur+.1);voices.push({src,gain,key,ends:now+dur});setTimeout(()=>{voices=voices.filter(v=>v.src!==src)},(dur+1)*1000)}
function breathe(){if(!active)return;const v=rand(.08,.24)*(.5+state.energy);source('substrate',{rate:rand(.91,1.04),loop:true,start:rand(0,Math.max(0,buffers.substrate.duration-40)),duration:rand(28,58),volume:v,filter:rand(260,900),attack:rand(8,16),release:rand(10,18),wet:.55,pan:rand(-.35,.35)});const next=rand(35,70);schedule(breathe,next)}
function pressure(){if(!active)return;source('pressure',{rate:rand(.72,1.06),start:rand(0,Math.max(0,buffers.pressure.duration-25)),duration:rand(15,34),volume:rand(.07,.17),filter:rand(180,700),attack:rand(5,12),release:rand(7,14),wet:.85,pan:rand(-.6,.6)});schedule(pressure,rand(48,105))}
function circulation(){if(!active)return;source('circulation',{rate:rand(.75,1.2),start:rand(0,Math.max(0,buffers.circulation.duration-20)),duration:rand(7,19),volume:rand(.035,.11),filter:rand(450,2600),attack:rand(2,6),release:rand(4,9),wet:.9,pan:rand(-.9,.9)});schedule(circulation,rand(17,43))}
function signal(){if(!active)return;source(choose(['signal','resonance']),{rate:rand(.68,1.15),start:rand(0,Math.max(0,buffers.signal.duration-7)),duration:rand(8,20),volume:rand(.045,.12),filter:rand(700,3800),attack:rand(1.5,5),release:rand(5,12),wet:1,pan:rand(-.8,.8)});schedule(signal,rand(65,150))}
function schedule(fn,seconds){const t=setTimeout(fn,seconds*1000);timers.push(t)}
function evolve(){if(!active)return;state.phase+=1;state.energy=Math.max(.12,Math.min(.85,state.energy+rand(-.08,.08)));state.pressure=Math.max(.05,Math.min(.8,state.pressure+rand(-.1,.1)));state.activity=Math.max(.08,Math.min(.75,state.activity+rand(-.12,.12)));$('orb').style.filter=`blur(${rand(.1,1.5)}px) hue-rotate(${rand(-18,18)}deg)`;$('orb').style.transform=`scale(${rand(.96,1.045)}) rotate(${rand(-3,3)}deg)`;$('readout').innerHTML=`SYSTEM / ACTIVE<br>ACTIVITY / ${state.activity<.28?'QUIET':state.activity<.52?'CIRCULATING':'AGITATED'}<br>STATE / ${state.pressure>.55?'UNDER PRESSURE':state.energy>.6?'EXPANDING':'IN EQUILIBRIUM'}`;$('status').innerHTML='Active<br>Autonomous process';schedule(evolve,rand(12,25))}
async function start(){try{$('start').disabled=true;$('status').innerHTML='Waking<br>Loading source material';buses=await init();await ctx.resume();if(ctx.state!=='running')throw new Error('Audio is paused by the browser. Tap Enter again.');active=true;$('start').textContent='Running';$('disturb').disabled=$('reseed').disabled=$('silence').disabled=false;$('hint').textContent='The environment is now operating';breathe();schedule(pressure,rand(8,18));schedule(circulation,rand(4,12));schedule(signal,rand(28,55));evolve()}catch(e){console.error(e);$('status').innerHTML='Unable to start<br>'+e.message;$('start').disabled=false;$('start').textContent='Try again'}}
function disturb(){if(!active)return;state.energy=Math.min(1,state.energy+.35);state.pressure=Math.min(1,state.pressure+.45);state.activity=Math.min(1,state.activity+.5);source('resonance',{rate:rand(.5,.8),start:rand(0,Math.max(0,buffers.resonance.duration-4)),duration:rand(12,20),volume:.2,filter:rand(400,1400),attack:.2,release:10,wet:1,pan:rand(-1,1)});source('circulation',{rate:rand(1.2,1.6),duration:12,volume:.12,filter:2400,attack:.3,release:7,wet:1,pan:rand(-1,1)});$('hint').textContent='A disturbance has passed through the system';setTimeout(()=>$('hint').textContent='The environment is now operating',4500)}
function reseed(){if(!active)return;state={energy:rand(.2,.6),pressure:rand(.1,.4),activity:rand(.12,.35),phase:0,seed:Math.random()*1e6};convolver.buffer=makeImpulse(rand(5,11),rand(2,4));delay.delayTime.setTargetAtTime(rand(1.3,4.8),ctx.currentTime,2);$('hint').textContent='The environment has reorganised';}
function silence(){if(!active)return;active=false;timers.forEach(clearTimeout);timers=[];voices.forEach(v=>{try{v.src.stop()}catch(e){}});voices=[];master.gain.setTargetAtTime(.0001,ctx.currentTime,1.5);$('status').innerHTML='Quiet<br>System suspended';$('hint').textContent='The environment has fallen quiet';$('start').disabled=false;$('start').textContent='Resume';$('disturb').disabled=$('reseed').disabled=$('silence').disabled=true;}
$('start').addEventListener('click',()=>{if(ctx&&ctx.state!=='closed'&&!active){ctx.resume();active=true;master.gain.setTargetAtTime(.7,ctx.currentTime,2);$('start').disabled=true;$('status').innerHTML='Active<br>Autonomous process';$('disturb').disabled=$('reseed').disabled=$('silence').disabled=false;breathe();pressure();circulation();signal();evolve()}else start()});$('disturb').addEventListener('click',disturb);$('reseed').addEventListener('click',reseed);$('silence').addEventListener('click',silence);
$('field').addEventListener('pointerdown',()=>{if(active)disturb()});
})();
</script></body></html>
