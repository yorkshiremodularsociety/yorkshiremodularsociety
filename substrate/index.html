<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUBSTRATE — autonomous sound study</title>
<style>
:root{color-scheme:dark;--ink:#100e15;--plum:#302335;--violet:#72556c;--pearl:#c9b7d2;--muted:#918794;--line:rgba(201,183,210,.16)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:var(--ink);color:#d9cbd9;font-family:Arial,Helvetica,sans-serif}body{height:100vh;height:100svh;min-height:0;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y;background:radial-gradient(ellipse at 53% 44%,#302335 0%,#1d1721 34%,#100e15 72%)}\nbody:before{content:"";position:fixed;inset:-22%;z-index:0;pointer-events:none;opacity:.34;background:radial-gradient(ellipse at 28% 38%,rgba(93,111,105,.16),transparent 42%),radial-gradient(ellipse at 72% 62%,rgba(115,77,112,.19),transparent 45%),radial-gradient(ellipse at 56% 18%,rgba(151,116,91,.10),transparent 38%);filter:blur(42px);animation:ambient-ground 115s ease-in-out infinite alternate}\n@keyframes ambient-ground{0%{transform:translate(-2%,1%) scale(1);filter:blur(42px) hue-rotate(-8deg)}100%{transform:translate(2%,-1%) scale(1.06);filter:blur(48px) hue-rotate(9deg)}}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.11;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E")}
main{position:fixed;inset:0;width:100%;height:100vh;height:100svh;min-height:0;overflow:hidden;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}.top{display:flex;align-items:flex-start;justify-content:space-between}.brand{font-size:13px;letter-spacing:.34em;font-weight:500}.sub{font-size:9px;letter-spacing:.18em;color:var(--muted);margin-top:9px;text-transform:uppercase}.status{font-size:9px;letter-spacing:.16em;color:#a99ba9;text-align:right;text-transform:uppercase}.top,.bottom,.hint{display:none!important}.field{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}.orb{width:min(76vw,720px);aspect-ratio:1;border-radius:50%;position:relative;filter:blur(.2px);opacity:.72;background:radial-gradient(ellipse at 35% 37%,rgba(193,139,114,.22),transparent 19%),radial-gradient(ellipse at 62% 58%,rgba(129,156,152,.22),transparent 24%),radial-gradient(ellipse at 48% 48%,rgba(114,85,108,.55),rgba(48,35,53,.12) 48%,transparent 69%);animation:breathe 17s ease-in-out infinite alternate}
.orb{isolation:isolate;overflow:visible;transition:box-shadow 1.4s ease}
.chromatic{position:absolute;inset:-5%;border-radius:50%;opacity:0;mix-blend-mode:screen;filter:blur(19px);background:radial-gradient(ellipse at 31% 34%,rgba(183,142,113,.34),transparent 29%),radial-gradient(ellipse at 69% 38%,rgba(115,160,145,.32),transparent 31%),radial-gradient(ellipse at 57% 72%,rgba(133,108,164,.38),transparent 35%),radial-gradient(ellipse at 22% 73%,rgba(172,174,125,.2),transparent 27%);transition:opacity 3.5s ease;animation:colour-drift 73s ease-in-out infinite alternate}
.orb .chromatic{transition:opacity 3.5s ease}\n.orb.awake{box-shadow:0 0 70px rgba(154,180,155,.16),0 0 140px rgba(128,102,145,.10)}\n.orb.awake .chromatic{opacity:.9}
.orb.awake .membrane{border-color:rgba(190,203,176,.23);box-shadow:inset 0 0 70px rgba(190,203,176,.09),0 0 55px rgba(145,171,158,.09)}
.orb.awake .filaments{opacity:.88;filter:drop-shadow(0 0 7px rgba(166,190,175,.24))}\n.silt{position:absolute;inset:13%;border-radius:50%;pointer-events:none;opacity:.34;background:radial-gradient(circle at 24% 39%,rgba(210,213,184,.72) 0 .12%,transparent .34%),radial-gradient(circle at 38% 72%,rgba(192,160,145,.62) 0 .10%,transparent .3%),radial-gradient(circle at 72% 29%,rgba(174,203,187,.68) 0 .13%,transparent .36%),radial-gradient(circle at 79% 61%,rgba(203,183,207,.62) 0 .11%,transparent .32%),radial-gradient(circle at 51% 18%,rgba(210,213,184,.5) 0 .1%,transparent .28%),radial-gradient(circle at 56% 83%,rgba(174,203,187,.58) 0 .12%,transparent .34%);filter:blur(.4px);animation:silt-drift 54s ease-in-out infinite alternate;transition:opacity 3s ease}\n.orb.awake .silt{opacity:.72}\n.pocket{position:absolute;border:1px solid rgba(190,198,177,.13);border-radius:50%;background:radial-gradient(ellipse at 36% 34%,rgba(202,211,185,.10),rgba(125,150,143,.025) 48%,transparent 72%);box-shadow:inset 0 0 24px rgba(191,205,181,.045),0 0 24px rgba(158,183,165,.035);filter:blur(.25px);opacity:.55;animation:pocket-drift 67s ease-in-out infinite alternate;transition:opacity 3s ease,border-color 3s ease}\n.pocket.a{width:23%;height:15%;left:25%;top:47%;transform:rotate(-24deg)}\n.pocket.b{width:16%;height:22%;right:24%;top:36%;transform:rotate(31deg);animation-duration:83s;animation-direction:alternate-reverse}\n.pocket.c{width:12%;height:9%;left:48%;bottom:22%;transform:rotate(12deg);animation-duration:91s}\n.orb.awake .pocket{opacity:.82;border-color:rgba(190,203,176,.22)}\n@keyframes silt-drift{from{transform:translate(-1%,1%) scale(.97)}to{transform:translate(1%,-1%) scale(1.04)}}\n@keyframes pocket-drift{from{translate:-3% 2%;scale:.92}to{translate:3% -2%;scale:1.08}}
@keyframes colour-drift{0%{transform:rotate(-12deg) scale(.94);filter:blur(22px) hue-rotate(-12deg)}100%{transform:rotate(14deg) scale(1.08);filter:blur(16px) hue-rotate(22deg)}}
.membrane{position:absolute;inset:12% 8%;border:1px solid rgba(181,196,180,.16);transition:border-color 2s ease,box-shadow 2s ease;border-radius:48% 52% 39% 61% / 42% 37% 63% 58%;background:radial-gradient(ellipse at 34% 32%,rgba(177,196,173,.09),transparent 42%),radial-gradient(ellipse at 70% 67%,rgba(161,125,151,.10),transparent 48%);box-shadow:inset 0 0 55px rgba(186,194,176,.055),0 0 45px rgba(145,171,158,.045);filter:blur(.35px);animation:membrane-drift 61s ease-in-out infinite alternate}
.membrane.two{inset:24% 17% 16% 21%;border-color:rgba(190,151,130,.19);border-radius:36% 64% 58% 42% / 57% 43% 57% 43%;transform:rotate(31deg);animation-duration:79s;animation-direction:alternate-reverse}
.membrane.three{inset:5% 28% 29% 3%;border-color:rgba(153,180,174,.12);border-radius:63% 37% 46% 54% / 39% 59% 41% 61%;animation-duration:93s}
.filaments{position:absolute;inset:3%;width:94%;height:94%;overflow:visible;opacity:.62;transition:opacity 2s ease,filter 2s ease;filter:drop-shadow(0 0 5px rgba(166,190,175,.16));animation:filament-drift 87s ease-in-out infinite alternate}
.filaments path{fill:none;stroke:rgba(184,198,181,.34);stroke-width:.22;stroke-linecap:round}
.filaments path:nth-child(2n){stroke:rgba(194,151,132,.28);stroke-width:.16}
.vesicle{position:absolute;width:9%;aspect-ratio:1;border:1px solid rgba(196,183,165,.27);border-radius:50%;background:radial-gradient(circle at 35% 32%,rgba(210,218,194,.22),rgba(144,164,153,.035) 54%,transparent 72%);box-shadow:inset 0 0 12px rgba(207,211,184,.08),0 0 18px rgba(172,193,178,.08);animation:vesicle-float 37s ease-in-out infinite alternate}
.vesicle.v1{left:19%;top:31%;width:7%}.vesicle.v2{right:21%;top:23%;width:11%;animation-delay:-13s;animation-duration:49s}.vesicle.v3{right:29%;bottom:17%;width:5%;animation-delay:-22s;animation-duration:43s}
@keyframes membrane-drift{0%{transform:rotate(-9deg) scale(.94) translate(-1%,1%);border-radius:48% 52% 39% 61% / 42% 37% 63% 58%}50%{border-radius:57% 43% 52% 48% / 51% 62% 38% 49%}100%{transform:rotate(13deg) scale(1.06) translate(2%,-1%);border-radius:39% 61% 58% 42% / 61% 39% 55% 45%}}
@keyframes filament-drift{from{transform:rotate(-8deg) scale(.94) translate(-1%,1%)}to{transform:rotate(9deg) scale(1.06) translate(1%,-2%)}}
@keyframes vesicle-float{from{transform:translate(-8px,7px) scale(.86);opacity:.36}to{transform:translate(11px,-12px) scale(1.12);opacity:.8}}
.orb:before,.orb:after{content:"";position:absolute;inset:8%;border:1px solid rgba(201,183,210,.14);border-radius:42% 58% 61% 39% / 48% 41% 59% 52%;transform:rotate(27deg);box-shadow:inset 0 0 70px rgba(201,183,210,.07),0 0 65px rgba(114,85,108,.12);animation:drift 29s ease-in-out infinite alternate}.orb:after{inset:19%;border-color:rgba(193,139,114,.16);border-radius:61% 39% 43% 57% / 40% 60% 40% 60%;transform:rotate(-38deg);animation-duration:23s;animation-direction:alternate-reverse}
@keyframes breathe{from{transform:scale(.92) rotate(-5deg);opacity:.5}to{transform:scale(1.06) rotate(6deg);opacity:.9}}@keyframes drift{from{transform:rotate(10deg) scale(.96)}to{transform:rotate(46deg) scale(1.04)}}
.hint{position:absolute;bottom:10%;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(201,183,210,.42)}.bottom{display:flex;align-items:flex-end;justify-content:space-between;border-top:1px solid var(--line);padding-top:17px}.readout{font-size:9px;line-height:1.8;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.controls{display:flex;gap:9px;align-items:center}button{font:inherit;color:rgba(217,203,217,.48);background:transparent;border:0;padding:12px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}button:hover{border-color:rgba(201,183,210,.55);background:rgba(201,183,210,.05)}button.primary{border-color:rgba(201,183,210,.42)}button:disabled{opacity:.35;cursor:default}.note{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:rgba(201,183,210,.5);white-space:nowrap;pointer-events:none}
@media(max-width:600px){.orb{width:min(82vw,440px,72svh)}}
</style>
</head>
<body><audio id="background-audio" playsinline></audio><div class="grain"></div><main>
<header class="top"><div><div class="brand">SUBSTRATE</div><div class="sub">Autonomous sound study / 01</div></div><div class="status" id="status">Dormant<br>Awaiting activation</div></header>
<section class="field" id="field"><div class="orb" id="orb" role="button" tabindex="0" aria-label="Start or disturb SUBSTRATE"><div class="chromatic"></div><div class="silt"></div><div class="pocket a"></div><div class="pocket b"></div><div class="pocket c"></div><div class="membrane"></div><div class="membrane two"></div><div class="membrane three"></div><svg class="filaments" viewBox="0 0 100 100" aria-hidden="true"><path d="M8 56 C22 48 20 30 38 34 S54 58 68 45 S77 20 94 27 M18 15 C27 29 39 25 45 42 S39 66 56 72 S78 67 88 86 M7 78 C22 68 31 75 38 61 S47 35 61 31 S80 40 96 13 M28 5 C35 20 27 35 16 43 S20 63 34 83 M58 7 C51 22 64 30 73 39 S66 59 81 72" /><path d="M12 35 C25 39 31 54 44 51 S61 30 75 34 S84 54 94 59 M14 91 C30 79 29 59 45 58 S63 76 73 64 S78 47 91 42 M39 9 C48 22 43 33 53 43 S73 50 70 65 S56 82 63 94" /></svg><div class="vesicle v1"></div><div class="vesicle v2"></div><div class="vesicle v3"></div></div><div class="hint" id="hint">An environment without a score</div></section>
<div class="controls" style="display:none"><button id="start">Start</button><button id="disturb" disabled>Disturb</button><button id="reseed" disabled>Reseed</button><button id="silence" disabled>Silence</button></div><div id="readout" style="display:none"></div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);let ctx=null,master=null,convolver=null,delay=null,feedback=null,streamOut=null,playbackPromise=null,active=false,voices=[],timers=[],state={energy:.38,pressure:.22,activity:.2,phase:0,seed:Math.random()*1e6};let buffers={};
const files={substrate:'assets/01_substrate.wav',pressure:'assets/02_pressure.wav',circulation:'assets/03_circulation.wav',signal:'assets/04_signal.wav',resonance:'assets/05_resonance.wav',beck:'assets/06_staithes_beck.mp3',rain:'assets/07_conservatory_rain.mp3'};
const rand=(a,b)=>a+Math.random()*(b-a);const choose=a=>a[Math.floor(Math.random()*a.length)];
function makeImpulse(seconds=8,decay=3.2){const len=Math.floor(ctx.sampleRate*seconds),ir=ctx.createBuffer(2,len,ctx.sampleRate);for(let c=0;c<2;c++){let d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}return ir}
async function init(){if('audioSession' in navigator){try{navigator.audioSession.type='playback'}catch(e){}}ctx=new (window.AudioContext||window.webkitAudioContext)();streamOut=ctx.createMediaStreamDestination();const player=$('background-audio');player.playsInline=true;player.srcObject=streamOut.stream;playbackPromise=player.play();await ctx.resume();master=ctx.createGain();master.gain.value=.8;const limiter=ctx.createDynamicsCompressor();limiter.threshold.value=-18;limiter.knee.value=18;limiter.ratio.value=3;limiter.attack.value=.02;limiter.release.value=.3;master.connect(limiter);limiter.connect(streamOut);convolver=ctx.createConvolver();convolver.buffer=makeImpulse();const wet=ctx.createGain();wet.gain.value=.68;convolver.connect(wet);wet.connect(master);delay=ctx.createDelay(8);delay.delayTime.value=2.7;feedback=ctx.createGain();feedback.gain.value=.27;const delayWet=ctx.createGain();delayWet.gain.value=.23;delay.connect(feedback);feedback.connect(delay);delay.connect(delayWet);delayWet.connect(master);const dryBus=ctx.createGain();dryBus.gain.value=.78;dryBus.connect(master);const wetBus=ctx.createGain();wetBus.gain.value=.68;wetBus.connect(convolver);wetBus.connect(delay);
for(const [key,url] of Object.entries(files)){const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw new Error('Could not load '+url+' ('+r.status+')');const data=await r.arrayBuffer();buffers[key]=await ctx.decodeAudioData(data)}await ctx.resume();
return {dryBus,wetBus};}
let buses;
function source(key,{rate=1,loop=false,start=0,duration=null,volume=.3,filter=1200,pan=0,attack=3,release=5,wet=.7}={}){if(!active||!buffers[key])return;const now=ctx.currentTime,src=ctx.createBufferSource(),gain=ctx.createGain(),f=ctx.createBiquadFilter(),p=ctx.createStereoPanner(),send=ctx.createGain();src.buffer=buffers[key];src.playbackRate.value=rate;src.loop=loop;f.type='lowpass';f.frequency.value=filter;f.Q.value=.65;p.pan.value=pan;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(Math.max(.001,volume),now+attack);const available=Math.max(1,(buffers[key].duration-start)/rate);const dur=Math.max(1,loop?(duration??240):Math.min(duration??rand(12,35),available));const a=Math.min(attack,dur*.28),rel=Math.min(release,dur*.42),sustainAt=Math.max(now+a,now+dur-rel);gain.gain.setValueAtTime(Math.max(.001,volume),sustainAt);gain.gain.exponentialRampToValueAtTime(.0001,now+dur);send.gain.value=wet;src.connect(f);f.connect(gain);gain.connect(send);send.connect(buses.wetBus);gain.connect(p);p.connect(buses.dryBus);src.start(now,start);src.stop(now+dur+.1);voices.push({src,gain,key,ends:now+dur});setTimeout(()=>{voices=voices.filter(v=>v.src!==src)},(dur+1)*1000)}
function breathe(){if(!active)return;const v=rand(.09,.17)*(.65+state.energy*.45);source('substrate',{rate:rand(.96,1.02),loop:true,start:rand(0,Math.max(0,buffers.substrate.duration-40)),duration:rand(210,270),volume:v,filter:rand(380,760),attack:rand(12,20),release:rand(28,38),wet:.58,pan:rand(-.22,.22)});schedule(breathe,rand(190,230))}
function pressure(){if(!active)return;source('pressure',{rate:rand(.88,.98),loop:true,start:rand(0,Math.max(0,buffers.pressure.duration-25)),duration:rand(180,240),volume:rand(.075,.14),filter:rand(260,560),attack:rand(16,24),release:rand(28,38),wet:.88,pan:rand(-.42,.42)});schedule(pressure,rand(165,210))}
function circulation(){if(!active)return;source('circulation',{rate:rand(.82,1.08),start:rand(0,Math.max(0,buffers.circulation.duration-20)),duration:rand(16,30),volume:rand(.035,.085),filter:rand(650,1900),attack:rand(5,10),release:rand(10,16),wet:.92,pan:rand(-.65,.65)});schedule(circulation,rand(34,58))}
function signal(){if(!active)return;const key=choose(['signal','resonance']);source(key,{rate:rand(.78,1.02),start:rand(0,Math.max(0,buffers[key].duration-7)),duration:rand(12,24),volume:rand(.045,.105),filter:rand(850,2600),attack:rand(5,11),release:rand(10,17),wet:1,pan:rand(-.7,.7)});schedule(signal,rand(58,100))}
function fluteBed(){
if(!active)return;
const lead=choose(['signal','resonance']);
source(lead,{rate:rand(.52,.66),loop:true,start:rand(0,Math.max(0,buffers[lead].duration-4)),duration:rand(235,285),volume:rand(.105,.145),filter:rand(2200,4200),attack:rand(26,36),release:rand(30,42),wet:1,pan:rand(-.32,.32)});
const second=lead==='signal'?'resonance':'signal';source(second,{rate:rand(.46,.58),loop:true,start:rand(0,Math.max(0,buffers[second].duration-4)),duration:rand(180,225),volume:rand(.035,.065),filter:rand(1600,3200),attack:rand(28,38),release:rand(30,42),wet:1,pan:rand(-.55,.55)});
schedule(fluteBed,rand(155,185));
}
function fluteEcho(){
if(!active)return;
const key=choose(['signal','resonance']);
source(key,{rate:rand(.43,.7),start:rand(0,Math.max(0,buffers[key].duration-3)),duration:rand(32,54),volume:rand(.035,.075),filter:rand(1700,3800),attack:rand(16,24),release:rand(24,32),wet:1,pan:rand(-.8,.8)});
schedule(fluteEcho,rand(28,43));
}
function fieldBeds(){if(!active)return;source('beck',{rate:rand(.985,1.015),loop:true,start:rand(0,Math.max(0,buffers.beck.duration-30)),duration:240,volume:rand(.105,.135),filter:rand(4200,7600),attack:2.5,release:34,wet:.62,pan:rand(-.12,.12)});source('rain',{rate:rand(.96,1.04),loop:true,start:rand(0,Math.max(0,buffers.rain.duration-20)),duration:250,volume:rand(.045,.065),filter:rand(2600,5200),attack:4,release:32,wet:.86,pan:rand(-.18,.18)});schedule(fieldBeds,210)}
function fieldFragments(){if(!active)return;const key=choose(['beck','beck','rain']);source(key,{rate:rand(.68,1.28),start:rand(0,Math.max(0,buffers[key].duration-35)),duration:rand(13,31),volume:rand(.045,.095),filter:rand(650,5200),attack:rand(3,9),release:rand(9,18),wet:rand(.72,1),pan:rand(-.72,.72)});schedule(fieldFragments,rand(27,48))}
function schedule(fn,seconds){const t=setTimeout(fn,seconds*1000);timers.push(t)}
function evolve(){if(!active)return;state.phase+=1;state.energy=Math.max(.12,Math.min(.85,state.energy+rand(-.025,.025)));state.pressure=Math.max(.05,Math.min(.8,state.pressure+rand(-.025,.025)));state.activity=Math.max(.08,Math.min(.75,state.activity+rand(-.035,.035)));$('orb').style.filter=`blur(${rand(.1,1.5)}px) hue-rotate(${rand(-18,18)}deg)`;$('orb').style.transform=`scale(${rand(.96,1.045)}) rotate(${rand(-3,3)}deg)`;$('readout').innerHTML=`SYSTEM / ACTIVE<br>ACTIVITY / ${state.activity<.28?'QUIET':state.activity<.52?'CIRCULATING':'AGITATED'}<br>STATE / ${state.pressure>.55?'UNDER PRESSURE':state.energy>.6?'EXPANDING':'IN EQUILIBRIUM'}`;$('status').innerHTML='Active<br>Autonomous process';schedule(evolve,rand(45,80))}
async function start(){try{$('start').disabled=true;$('status').innerHTML='Waking<br>Loading source material';buses=await init();await playbackPromise;await ctx.resume();if(ctx.state!=='running')throw new Error('Audio is paused by the browser. Tap Enter again.');active=true;$('orb').classList.add('awake');$('start').textContent='Silence';$('disturb').disabled=$('reseed').disabled=$('silence').disabled=false;$('hint').textContent='The environment is now operating';fieldBeds();fluteBed();fluteEcho();fieldFragments();circulation();signal();schedule(fieldFragments,rand(18,32));schedule(circulation,rand(28,42));schedule(signal,rand(42,65));evolve()}catch(e){console.error(e);$('status').innerHTML='Unable to start<br>'+e.message;$('start').disabled=false;$('start').textContent='Try again'}}
function disturb(){if(!active)return;state.energy=Math.min(1,state.energy+.35);state.pressure=Math.min(1,state.pressure+.45);state.activity=Math.min(1,state.activity+.5);source('resonance',{rate:rand(.5,.8),start:rand(0,Math.max(0,buffers.resonance.duration-4)),duration:rand(16,26),volume:.2,filter:rand(400,1400),attack:.2,release:14,wet:1,pan:rand(-1,1)});source('circulation',{rate:rand(1.2,1.6),duration:16,volume:.12,filter:2400,attack:.3,release:10,wet:1,pan:rand(-1,1)});schedule(()=>{if(active)source('pressure',{rate:rand(.7,.85),start:rand(0,Math.max(0,buffers.pressure.duration-12)),duration:rand(24,38),volume:.13,filter:rand(500,1100),attack:4,release:14,wet:1,pan:rand(-.8,.8)})},5);schedule(()=>{if(active)source('signal',{rate:rand(.65,.85),start:rand(0,Math.max(0,buffers.signal.duration-8)),duration:rand(14,22),volume:.11,filter:rand(1200,3200),attack:2,release:12,wet:1,pan:rand(-1,1)})},19);$('hint').textContent='A disturbance has passed through the system';setTimeout(()=>$('hint').textContent='The environment is now operating',6500)}
function reseed(){if(!active)return;state={energy:rand(.2,.6),pressure:rand(.1,.4),activity:rand(.12,.35),phase:0,seed:Math.random()*1e6};convolver.buffer=makeImpulse(rand(5,11),rand(2,4));delay.delayTime.setTargetAtTime(rand(1.3,4.8),ctx.currentTime,2);$('hint').textContent='The environment has reorganised';}
function silence(){if(!active)return;active=false;$('orb').classList.remove('awake');timers.forEach(clearTimeout);timers=[];voices.forEach(v=>{try{v.src.stop()}catch(e){}});voices=[];master.gain.setTargetAtTime(.0001,ctx.currentTime,1.5);$('status').innerHTML='Quiet<br>System suspended';$('hint').textContent='The environment has fallen quiet';$('start').disabled=false;$('start').textContent='Enter';$('disturb').disabled=$('reseed').disabled=$('silence').disabled=true;}
$('start').addEventListener('click',()=>{if(active){silence();return}if(ctx&&ctx.state!=='closed'&&!active){ctx.resume();active=true;$('orb').classList.add('awake');master.gain.setTargetAtTime(.8,ctx.currentTime,2);$('start').textContent='Silence';$('start').disabled=false;$('status').innerHTML='Active<br>Autonomous process';$('disturb').disabled=$('reseed').disabled=$('silence').disabled=false;fieldBeds();fieldFragments();circulation();signal();schedule(fieldFragments,rand(28,48));schedule(circulation,rand(38,58));schedule(signal,rand(55,85));evolve()}else start()});$('disturb').addEventListener('click',disturb);$('reseed').addEventListener('click',reseed);$('silence').addEventListener('click',silence);
$('orb').addEventListener('pointerdown',()=>{if(active)silence();else start()});
