
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YMS / ON AIR</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #080b08;
  color: #a5d83c;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
}

.container {
  width: 100%;
  max-width: 1050px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 24px;
  border-bottom: 1px solid #35402d;
}

h1 {
  font-size: clamp(32px, 6vw, 58px);
  letter-spacing: -3px;
  margin: 0;
}

.status {
  font-size: 10px;
  letter-spacing: 2px;
  border: 1px solid #536c2d;
  padding: 10px 13px;
}

.dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  background: #a5d83c;
  border-radius: 50%;
  margin-right: 7px;
}

main { padding-top: 35px; }

.label {
  font-size: 10px;
  letter-spacing: 3px;
  color: #78836f;
  margin-bottom: 12px;
}

.visual {
  position: relative;
  width: 100%;
  height: clamp(280px, 48vw, 470px);
  background: #050805;
  border: 1px solid #263122;
  overflow: hidden;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(
    ellipse at center,
    transparent 15%,
    rgba(0,0,0,.5) 100%
  );
}

.track {
  padding: 28px 0;
}

.track h2 {
  font-size: clamp(25px, 4vw, 38px);
  letter-spacing: -1px;
  margin: 0 0 9px;
}

.track p {
  color: #78836f;
  font-size: 11px;
  letter-spacing: 2px;
  margin: 0;
}

.controls {
  display: flex;
  align-items: center;
  gap: 25px;
  border-top: 1px solid #35402d;
  border-bottom: 1px solid #35402d;
  padding: 23px 0;
}

button {
  background: none;
  border: 1px solid #a5d83c;
  color: #a5d83c;
  padding: 13px 25px;
  font-size: 11px;
  letter-spacing: 2px;
  cursor: pointer;
}

button:hover {
  background: #a5d83c;
  color: #080b08;
}

.volume {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-left: auto;
  font-size: 10px;
  letter-spacing: 2px;
  color: #78836f;
}

input[type=range] {
  width: 100px;
  accent-color: #a5d83c;
}

footer {
  display: flex;
  justify-content: space-between;
  padding-top: 20px;
  color: #59634f;
  font-size: 9px;
  letter-spacing: 2px;
}

@media(max-width:550px) {
  body { padding: 18px; }
  header { gap: 10px; }
  .status { font-size: 8px; }
  .controls { gap: 12px; flex-wrap: wrap; }
  .volume { margin-left: 0; width: 100%; }
  input[type=range] { flex: 1; }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>YMS / ON AIR</h1>
  <div class="status">
    <span class="dot"></span>TRANSMITTING
  </div>
</header>

<main>
  <div class="label">YORKSHIRE MODULAR SOCIETY / TRANSMISSION 001</div>

  <div class="visual">
    <canvas id="visualiser"></canvas>
    <div class="overlay"></div>
  </div>

  <div class="track">
    <h2>AN INTRODUCTION</h2>
    <p>YMS / SELECTED RECORDING / CONTINUOUS PLAYBACK</p>
  </div>

  <div class="controls">
    <button id="play">START TRANSMISSION</button>

    <div class="volume">
      <span>VOLUME</span>
      <input id="volume" type="range"
        min="0" max="1" step="0.01" value="0.7">
    </div>
  </div>
</main>

<footer>
  <span>YMS TRANSMISSION SYSTEM</span>
  <span>BRADFORD / ENGLAND</span>
</footer>

</div>

<audio id="audio" src="audio/on-air.mp3"
  loop preload="auto"></audio>

<script>
const audio = document.getElementById("audio");
const button = document.getElementById("play");
const canvas = document.getElementById("visualiser");
const ctx = canvas.getContext("2d");

let audioContext, analyser, source, data;
let playing = false;

function setupAudio() {
  if (audioContext) return;

  audioContext = new AudioContext();
  analyser = audioContext.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.88;

  source = audioContext.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioContext.destination);

  data = new Uint8Array(analyser.frequencyBinCount);
}

button.addEventListener("click", async () => {
  setupAudio();

  if (audioContext.state === "suspended") {
    await audioContext.resume();
  }

  if (!playing) {
    try {
      await audio.play();
      playing = true;
      button.textContent = "PAUSE TRANSMISSION";
    } catch (error) {
      button.textContent = "PLAYBACK ERROR";
    }
  } else {
    audio.pause();
    playing = false;
    button.textContent = "RESUME TRANSMISSION";
  }
});

document.getElementById("volume").addEventListener("input", e => {
  audio.volume = Number(e.target.value);
});

audio.volume = 0.7;

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
}

window.addEventListener("resize", resize);
resize();

let time = 0;

function draw() {
  requestAnimationFrame(draw);

  const w = canvas.width;
  const h = canvas.height;

  ctx.fillStyle = "#050805";
  ctx.fillRect(0, 0, w, h);

  if (analyser && playing) {
    analyser.getByteFrequencyData(data);
  }

  const bass = analyser && playing
    ? data.slice(0, 35).reduce((a,b) => a+b,0) / 35 / 255
    : 0.04;

  const mid = analyser && playing
    ? data.slice(35, 120).reduce((a,b) => a+b,0) / 85 / 255
    : 0.02;

  time += 0.004 + bass * 0.008;

  const cx = w / 2;
  const cy = h / 2;

  for (let layer = 0; layer < 9; layer++) {
    ctx.beginPath();

    const radius = Math.min(w,h) *
      (0.08 + layer * 0.045 + bass * 0.06);

    for (let i = 0; i <= 360; i++) {
      const angle = i * Math.PI / 180;

      const distortion =
        Math.sin(angle * 3 + time + layer) * 0.12 +
        Math.sin(angle * 7 - time * 0.7) * 0.045 +
        Math.sin(angle * 2 + time * 0.3) * mid * 0.3;

      const r = radius * (1 + distortion);

      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r * 0.7;

      if (i === 0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }

    ctx.closePath();
    ctx.strokeStyle = `rgba(165,216,60,${0.035 + layer * 0.009})`;
    ctx.lineWidth = 1.3 * (window.devicePixelRatio || 1);
    ctx.stroke();
  }

  const glow = ctx.createRadialGradient(
    cx, cy, 0, cx, cy, Math.min(w,h)*0.48
  );

  glow.addColorStop(0, `rgba(120,180,35,${0.035+bass*0.08})`);
  glow.addColorStop(1, "rgba(0,0,0,0)");

  ctx.fillStyle = glow;
  ctx.fillRect(0,0,w,h);
}

draw();
</script>
</body>
</html>
