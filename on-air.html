<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YMS / ON AIR</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101510;
  color: #a5d83c;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  padding: 40px;
}

.container {
  max-width: 1050px;
  margin: 0 auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #35402d;
  padding-bottom: 25px;
}

h1 {
  font-size: clamp(30px, 6vw, 56px);
  letter-spacing: -3px;
  margin: 0;
}

.status {
  font-size: 11px;
  letter-spacing: 2px;
  border: 1px solid #a5d83c;
  padding: 9px 12px;
}

main {
  padding-top: 65px;
}

.label {
  color: #78836f;
  font-size: 11px;
  letter-spacing: 3px;
  margin-bottom: 20px;
}

h2 {
  font-size: 32px;
  letter-spacing: -1px;
  margin: 0 0 12px;
}

.description {
  color: #78836f;
  font-size: 13px;
  margin-bottom: 35px;
}

.player {
  width: 100%;
  min-height: 500px;
  border: 1px solid #35402d;
  background: #080b08;
}

iframe {
  width: 100%;
  height: 600px;
  border: 0;
  background: #080b08;
}

footer {
  margin-top: 25px;
  border-top: 1px solid #35402d;
  padding-top: 20px;
  display: flex;
  justify-content: space-between;
  color: #78836f;
  font-size: 10px;
  letter-spacing: 2px;
}

@media(max-width:600px) {
  body { padding: 20px; }
  header { align-items: flex-start; }
  .player { min-height: 450px; }
  iframe { height: 500px; }
  footer { gap: 15px; flex-wrap: wrap; }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>YMS / ON AIR</h1>
  <div class="status">● BROADCAST</div>
</header>

<main>
  <div class="label">YORKSHIRE MODULAR SOCIETY</div>
  <h2>THE SLEEP MIX</h2>
  <div class="description">
    488 TRACKS / 324 HOURS / RANDOM ROTATION
  </div>

  <div class="player">
    <iframe
      src="https://bandcamp.com/Oxynucid/playlist/yorkshire-modular-society-sleep-mix"
      title="YMS Sleep Mix">
    </iframe>
  </div>
</main>

<footer>
  <span>YMS TRANSMISSION SYSTEM</span>
  <span>BRADFORD / ENGLAND</span>
</footer>

</div>
</body>
</html>
