
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b08">
<title>YMS / ON AIR — 0205</title>
<style>
:root {
  --acid: #a5d83c;
  --muted: #9aa293;
  --line: rgba(165,216,60,.22);
  --panel: #101510;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #080b08; }
body {
  min-height: 100svh;
  padding: 2px;
  color: var(--acid);
  font-family: Arial, Helvetica, sans-serif;
}
.player {
  min-height: calc(100svh - 4px);
  width: 100%;
  border-radius: 21px;
  background: var(--panel);
  padding: clamp(16px, 1.7vw, 25px);
  display: flex;
  flex-direction: column;
}
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 45px;
  margin-bottom: 20px;
}
.brand {
  margin: 0;
  font-size: clamp(23px, 2.7vw, 36px);
  line-height: 1;
  letter-spacing: -.055em;
  font-weight: 700;
}
.live {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  border-radius: 30px;
  padding: 7px 14px;
  background: rgba(20, 92, 43, .32);
  color: #20d86b;
  font-size: clamp(11px, 1.4vw, 19px);
  letter-spacing: .07em;
  white-space: nowrap;
}
.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #20d86b;
  box-shadow: 0 0 10px rgba(32,216,107,.55);
}
.visual {
  position: relative;
  flex: 1 1 auto;
  min-height: 300px;
  overflow: hidden;
  border-radius: 27px;
  isolation: isolate;
  background:
    radial-gradient(ellipse 58% 38% at 52% 106%, rgba(73,205,112,.72), transparent 75%),
    radial-gradient(ellipse 65% 35% at 83% 91%, rgba(35,156,91,.46), transparent 75%),
    radial-gradient(ellipse 60% 31% at 18% 90%, rgba(38,133,76,.48), transparent 78%),
    linear-gradient(180deg, #080909 0%, #090b09 45%, #101b12 100%);
  border: 1px solid rgba(165,216,60,.08);
}
.mist {
  position: absolute;
  inset: -30%;
  pointer-events: none;
  will-change: transform;
  transform: translate3d(0,0,0);
}
.mist-a {
  background:
    radial-gradient(ellipse 38% 24% at 29% 72%, rgba(47,163,83,.34), transparent 78%),
    radial-gradient(ellipse 42% 27% at 72% 76%, rgba(67,207,116,.32), transparent 78%),
    radial-gradient(ellipse 48% 25% at 50% 96%, rgba(113,224,139,.25), transparent 78%);
  filter: blur(22px);
  animation: drift-a 58s ease-in-out infinite alternate;
}
.mist-b {
  background:
    radial-gradient(ellipse 36% 22% at 70% 60%, rgba(20,111,66,.34), transparent 80%),
    radial-gradient(ellipse 35% 24% at 28% 88%, rgba(92,196,108,.23), transparent 80%);
  filter: blur(34px);
  animation: drift-b 76s ease-in-out infinite alternate;
}
.mist-c {
  background:
    radial-gradient(ellipse 44% 18% at 50% 82%, rgba(132,207,123,.18), transparent 80%);
  filter: blur(42px);
  animation: drift-c 93s ease-in-out infinite alternate;
}
@keyframes drift-a {
  from { transform: translate3d(-3%, 2%, 0) scale(1); }
  to { transform: translate3d(3%, -2%, 0) scale(1.08); }
}
@keyframes drift-b {
  from { transform: translate3d(3%, -2%, 0) scale(1.04); }
  to { transform: translate3d(-3%, 2%, 0) scale(1); }
}
@keyframes drift-c {
  from { transform: translate3d(-2%, -2%, 0) scale(1); }
  to { transform: translate3d(2%, 2%, 0) scale(1.07); }
}
.texture {
  position: absolute;
  inset: 0;
  opacity: .17;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.34'/%3E%3C/svg%3E");
  mix-blend-mode: soft-light;
}
.visual:after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,.18), transparent 38%, rgba(0,0,0,.03));
}
.track { padding: 25px 0 21px; }
.track h2 {
  margin: 0;
  font-size: clamp(30px, 3.2vw, 43px);
  line-height: 1;
  letter-spacing: -.045em;
  font-weight: 700;
}
.artist {
  margin: 28px 0 0;
  color: var(--muted);
  font-size: clamp(13px, 1.55vw, 21px);
  letter-spacing: .015em;
}
.rule {
  height: 1px;
  background: var(--line);
  flex: 0 0 1px;
}
.controls {
  min-height: 88px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 17px 0 5px;
}
.control {
  border: 0;
  background: transparent;
  color: var(--acid);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
}
.control:focus-visible, input:focus-visible {
  outline: 2px solid white;
  outline-offset: 4px;
}
.play {
  width: 47px;
  height: 47px;
  border-radius: 50%;
  background: var(--acid);
  color: #101510;
}
.play:hover { background: #c0ed61; }
.volume-wrap {
  justify-self: end;
  display: flex;
  align-items: center;
  gap: 12px;
}
.volume {
  width: 0;
  opacity: 0;
  transition: width .2s ease, opacity .2s ease;
  accent-color: var(--acid);
}
.volume-wrap:hover .volume,
.volume-wrap:focus-within .volume {
  width: 92px;
  opacity: 1;
}
.track-count {
  text-align: center;
  color: var(--acid);
  font-size: clamp(11px, 1.45vw, 19px);
  letter-spacing: .025em;
  padding: 10px 0 0;
}
@media (max-width: 600px) {
  .player { padding: 15px; border-radius: 16px; }
  .top { margin-bottom: 14px; }
  .visual { min-height: 42svh; border-radius: 19px; }
  .track { padding: 20px 0 17px; }
  .artist { margin-top: 17px; }
  .controls { min-height: 76px; }
  .volume-wrap:hover .volume, .volume-wrap:focus-within .volume {
    width: 65px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .mist { animation: none !important; }
}
</style>
</head>
<body>
<section class="player" aria-label="YMS ON AIR music player">
  <header class="top">
    <h1 class="brand">YMS / ON AIR</h1>
    <div class="live"><span class="live-dot"></span>TRANSMITTING</div>
  </header>

  <div class="visual" aria-label="Slow-moving abstract green mist visual">
    <div class="mist mist-a"></div>
    <div class="mist mist-b"></div>
    <div class="mist mist-c"></div>
    <div class="texture"></div>
  </div>

  <section class="track">
    <h2>0205</h2>
    <p class="artist">YORKSHIRE MODULAR SOCIETY</p>
  </section>

  <div class="rule"></div>

  <div class="controls">
    <div></div>
    <button class="control play" id="play" type="button" aria-label="Start transmission" title="Start transmission">
      <svg id="play-icon" width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>
    <div class="volume-wrap">
      <button class="control" id="mute" type="button" aria-label="Mute or unmute" title="Mute or unmute">
        <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4z"/>
          <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
          <path d="M19 5a10 10 0 0 1 0 14"/>
        </svg>
      </button>
      <input class="volume" id="volume" type="range" min="0" max="1" step=".01" value=".7" aria-label="Volume">
    </div>
  </div>

  <div class="track-count">ONE RECORDING / CONTINUOUS PLAYBACK</div>
</section>

<audio id="audio" src="audio/0205.mp3" preload="metadata" loop></audio>

<script>
const audio = document.getElementById('audio');
const play = document.getElementById('play');
const playIcon = document.getElementById('play-icon');
const volume = document.getElementById('volume');
const mute = document.getElementById('mute');

audio.volume = Number(volume.value);

function setPlaying(isPlaying) {
  play.setAttribute('aria-label', isPlaying ? 'Pause transmission' : 'Start transmission');
  play.title = isPlaying ? 'Pause transmission' : 'Start transmission';
  playIcon.innerHTML = isPlaying
    ? '<path d="M7 5h4v14H7zM15 5h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

play.addEventListener('click', async () => {
  if (!audio.paused) {
    audio.pause();
    return;
  }
  try {
    await audio.play();
  } catch (error) {
    console.error('Audio playback failed:', error);
    play.title = 'Playback unavailable — try again';
  }
});

audio.addEventListener('play', () => setPlaying(true));
audio.addEventListener('pause', () => setPlaying(false));
audio.addEventListener('ended', () => setPlaying(false));

volume.addEventListener('input', () => {
  audio.volume = Number(volume.value);
  audio.muted = audio.volume === 0;
});

mute.addEventListener('click', () => {
  audio.muted = !audio.muted;
  mute.style.opacity = audio.muted ? '.45' : '1';
});
</script>
</body>
</html>
