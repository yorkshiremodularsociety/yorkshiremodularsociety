<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>BOWLS — Yorkshire Modular Society</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');
:root{--acid:#c4ff38;--ink:#050711;--muted:rgba(196,207,229,.48);--line:rgba(165,184,218,.13)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ink);color:#e8edf8;font-family:Inter,system-ui,sans-serif;overscroll-behavior:none}
body{min-height:100svh;overflow-x:hidden;background:
 radial-gradient(ellipse at 50% 4%,rgba(75,44,132,.25),transparent 42%),
 radial-gradient(ellipse at 15% 62%,rgba(35,54,113,.19),transparent 46%),
 radial-gradient(ellipse at 88% 75%,rgba(45,91,73,.13),transparent 44%),
 linear-gradient(180deg,#05040b,#080b16 58%,#04070d)}
.ambient,.ambient:before,.ambient:after{position:fixed;inset:-15%;pointer-events:none;z-index:0}
.ambient{background:radial-gradient(ellipse at 25% 35%,rgba(127,77,191,.12),transparent 48%),radial-gradient(ellipse at 75% 62%,rgba(55,104,145,.12),transparent 48%);filter:blur(28px);animation:drift 28s ease-in-out infinite alternate}
.ambient:before{content:"";background:radial-gradient(ellipse at 68% 24%,rgba(169,64,145,.08),transparent 44%);animation:drift 34s ease-in-out infinite alternate-reverse}
.ambient:after{content:"";background:radial-gradient(ellipse at 35% 78%,rgba(73,119,91,.08),transparent 42%);animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,1%,0) scale(1)}to{transform:translate3d(3%,-2%,0) scale(1.08)}}
.grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E")}
main{position:relative;z-index:2;width:min(100%,1060px);margin:auto;padding:24px 26px 38px}
header{display:none}
.brand{font-weight:500}.status{display:flex;align-items:center;gap:8px}.dot{width:5px;height:5px;border-radius:50%;background:#536174;box-shadow:0 0 10px #536174}
.status.live .dot{background:var(--acid);box-shadow:0 0 12px rgba(196,255,56,.75)}
.intro{display:none}
h1{font-weight:300;font-size:clamp(30px,4vw,42px);letter-spacing:.2em;margin:0;text-shadow:0 0 38px rgba(143,126,220,.18)}
.subtitle{font-size:9px;letter-spacing:.2em;color:rgba(186,200,226,.35)}
.intro-note{font-size:11px;line-height:1.8;color:rgba(186,200,226,.42);text-align:right;padding-bottom:3px}
.stage{position:relative;min-height:390px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:center;padding:25px 0 35px}
.bowl{--hue:265;--glow:rgba(151,112,220,.28);--bloom:0;position:relative;aspect-ratio:1;border:1px solid rgba(165,184,218,.12);border-radius:50%;background:radial-gradient(ellipse at 42% 34%,hsla(var(--hue),calc(30% + var(--bloom)*28%),calc(9% + var(--bloom)*45%),calc(.16 + var(--bloom)*.58)),transparent 68%),radial-gradient(ellipse at 50% 65%,hsla(var(--hue),38%,calc(5% + var(--bloom)*25%),calc(.20 + var(--bloom)*.44)),rgba(4,7,15,.82) 88%);box-shadow:inset 0 0 calc(24px + var(--bloom)*36px) hsla(var(--hue),70%,65%,calc(.025 + var(--bloom)*.16)),0 16px 50px rgba(0,0,0,.2),0 0 calc(var(--bloom)*28px) hsla(var(--hue),75%,70%,calc(var(--bloom)*.22));display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .5s,box-shadow .5s,transform .5s;isolation:isolate}
.bowl.active{border-color:rgba(196,255,56,.3);box-shadow:inset 0 0 46px var(--glow),0 0 36px rgba(90,105,160,.12)}
.bowl.hit{transform:scale(1.025)}
@keyframes ring{0%{transform:scale(.86);opacity:.8}100%{transform:scale(1.18);opacity:0}}

.bowl-label{position:absolute;bottom:-29px;font-size:9px;letter-spacing:.18em;color:rgba(196,207,229,.46)}
.bowl.active .bowl-label{color:rgba(196,255,56,.7)}
.bowl-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:8px;letter-spacing:.14em;color:rgba(220,228,245,.2);pointer-events:none}
.controls{display:grid;grid-template-columns:1.45fr 1fr;gap:30px;margin-top:0;align-items:start}
.panel{border:0;border-radius:0;padding:8px 0;background:none;box-shadow:none;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid rgba(165,184,218,.10)}
.panel-title{font-size:9px;letter-spacing:.18em;color:rgba(214,224,242,.6)}
.panel-hint{font-size:8px;letter-spacing:.1em;color:rgba(176,190,216,.3)}
.edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}
.edit{border:0;border-bottom:1px solid rgba(165,184,218,.07);border-radius:0;padding:8px 0 10px;background:none;display:grid;gap:7px}
.edit-top{display:flex;justify-content:flex-end;align-items:center;min-height:13px}
.edit-name{font-size:9px;letter-spacing:.15em;color:rgba(213,223,241,.72)}
.edit-val{font-size:10px;color:rgba(211,222,241,.55);font-variant-numeric:tabular-nums}
label{font-size:8px;letter-spacing:.14em;color:rgba(180,194,219,.4);display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--acid);height:3px;cursor:pointer}
.subcontrol{display:grid;gap:2px}
.space-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.space-presets{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 0}
.space-choice{appearance:none;border:1px solid transparent;border-radius:20px;background:rgba(165,184,218,.035);color:rgba(190,204,228,.52);padding:8px 11px;font-size:8px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .35s}
.space-choice:hover{border-color:rgba(165,184,218,.3);color:rgba(220,230,246,.8)}
.space-choice.selected{border-color:rgba(196,255,56,.28);background:rgba(196,255,56,.07);color:rgba(220,236,190,.9);box-shadow:none}
.master-level{display:none}
@media(max-width:560px){.space-presets{gap:5px}.space-choice{padding:9px 11px;font-size:8px}}

.transport{display:flex;align-items:center;justify-content:center;gap:15px;padding:14px 0 2px}
button{font:inherit}
#play{border:1px solid rgba(196,255,56,.35);border-radius:30px;padding:12px 28px;background:rgba(196,255,56,.07);color:var(--acid);font-size:9px;letter-spacing:.2em;cursor:pointer;transition:.25s}
#play:hover{background:rgba(196,255,56,.13);box-shadow:0 0 24px rgba(196,255,56,.08)}
.transport-note{font-size:9px;letter-spacing:.12em;color:rgba(180,194,219,.36)}
footer{display:none}
@media(max-width:700px){main{padding:18px 17px 30px}.stage{min-height:0;gap:13px;padding:22px 0 39px}.bowl-label{font-size:8px}.intro{padding-top:29px}.intro-note{display:none}.controls{grid-template-columns:1fr;gap:22px}.space-grid{gap:14px}}
@media(max-width:430px){main{padding:14px 12px 26px}.stage{gap:8px;padding:20px 0 35px}.bowl-label{font-size:7px;letter-spacing:.12em;bottom:-24px}.panel{padding:4px 0}.edit-grid{gap:0 14px}.edit{padding:10px 0}.space-grid{gap:10px}.panel-hint{display:none}h1{font-size:34px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* BOWLS v1.7 — grouped instrument areas and arc controls */
.bowl-area{border:1px solid rgba(165,184,218,.12);border-radius:24px;padding:22px 24px 18px;background:linear-gradient(145deg,rgba(18,23,43,.34),rgba(8,12,24,.24));box-shadow:0 18px 60px rgba(0,0,0,.12);backdrop-filter:blur(12px)}
.stage{min-height:0;padding:8px 0 34px;gap:20px}
.edit-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:0 18px}
.edit{border:0;border-top:1px solid rgba(165,184,218,.09);padding:16px 4px 4px;display:block}
.dial-pair{display:flex;justify-content:center;gap:clamp(14px,3vw,34px)}
.dial-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.dial-caption{font-size:7px;letter-spacing:.16em;color:rgba(190,204,228,.36)}
.arc-control{--p:.5;position:relative;width:82px;height:46px;cursor:ew-resize;touch-action:none;outline:none;user-select:none}
.arc-control svg{display:block;width:100%;height:100%;overflow:visible}
.arc-track,.arc-progress{fill:none;stroke-width:1.5;stroke-linecap:round}
.arc-track{stroke:rgba(154,174,207,.17)}
.arc-progress{stroke:rgba(196,255,56,.68);stroke-dasharray:calc(var(--p)*126) 126;filter:drop-shadow(0 0 3px rgba(196,255,56,.22))}
.arc-point{fill:rgba(220,238,190,.95);filter:drop-shadow(0 0 4px rgba(196,255,56,.45))}
.arc-control:focus-visible,.arc-control.dragging{filter:drop-shadow(0 0 5px rgba(196,255,56,.25))}
.dial-value{font-size:9px;line-height:1;color:rgba(218,228,244,.58);font-variant-numeric:tabular-nums;min-height:10px}
.space-area{margin-top:18px;border:1px solid rgba(165,184,218,.12);border-radius:20px;padding:16px 20px;background:linear-gradient(145deg,rgba(18,23,43,.30),rgba(8,12,24,.2));backdrop-filter:blur(12px)}
.space-presets{justify-content:center;gap:8px;margin:0}
.space-choice{padding:9px 15px}
@media(max-width:700px){.bowl-area{padding:18px 14px 15px}.stage{gap:12px;padding:6px 0 31px}.edit-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 12px}.edit{padding:12px 2px 2px}.dial-pair{gap:22px}.space-area{margin-top:14px;padding:14px 10px}.space-presets{gap:4px}.space-choice{padding:9px 10px}}
@media(max-width:390px){.bowl-area{padding:15px 10px 12px}.arc-control{width:76px;height:43px}.dial-pair{gap:16px}.space-choice{font-size:7px;padding:8px 8px}}


/* BOWLS v1.8 — Dronebath-inspired atmosphere */
body{background:
 radial-gradient(ellipse at 18% 18%,rgba(116,73,170,.20),transparent 42%),
 radial-gradient(ellipse at 82% 30%,rgba(46,92,145,.17),transparent 44%),
 radial-gradient(ellipse at 52% 88%,rgba(54,105,91,.13),transparent 48%),
 linear-gradient(145deg,#050711 0%,#090b19 48%,#050911 100%)}
.ambient{background:
 radial-gradient(ellipse at 24% 36%,rgba(139,91,194,.16),transparent 48%),
 radial-gradient(ellipse at 76% 58%,rgba(66,116,167,.15),transparent 48%);
 filter:blur(42px);opacity:.9;animation:drift 32s ease-in-out infinite alternate}
.ambient:before{background:radial-gradient(ellipse at 70% 22%,rgba(179,76,157,.10),transparent 46%);filter:blur(16px)}
.ambient:after{background:radial-gradient(ellipse at 32% 78%,rgba(80,145,111,.10),transparent 44%);filter:blur(18px)}
.bowl-area,.space-area{position:relative;overflow:hidden;border:1px solid rgba(168,187,222,.105);backdrop-filter:blur(22px) saturate(125%);-webkit-backdrop-filter:blur(22px) saturate(125%);box-shadow:inset 0 1px 0 rgba(220,230,255,.035),0 24px 70px rgba(0,0,0,.20)}
.bowl-area{border-radius:28px;padding:24px 25px 20px;background:linear-gradient(135deg,rgba(37,36,67,.30),rgba(13,22,43,.25) 55%,rgba(12,26,31,.20))}
.bowl-area:before,.space-area:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(190,165,255,.035),transparent 36%,rgba(108,161,194,.025) 72%,transparent);opacity:.9}
.bowl-area>* ,.space-area>*{position:relative;z-index:1}
.bowl{border-color:rgba(181,195,226,.16);box-shadow:inset 0 0 35px rgba(125,140,190,.035),0 18px 50px rgba(0,0,0,.18)}
.bowl.active{border-color:rgba(190,205,230,.30);box-shadow:inset 0 0 52px var(--glow),0 0 38px rgba(112,126,180,.13)}
.bowl-label{color:rgba(207,218,240,.48);letter-spacing:.2em}
.edit{border-top-color:rgba(174,190,222,.10)}
.dial-caption{color:rgba(190,205,231,.43);letter-spacing:.18em}
.arc-track{stroke:rgba(177,194,224,.20)}
.arc-progress{stroke:rgba(166,190,225,.78);filter:drop-shadow(0 0 4px rgba(139,167,214,.25))}
.arc-point{fill:rgba(225,235,252,.94);filter:drop-shadow(0 0 5px rgba(152,181,228,.5))}
.dial-value{color:rgba(216,226,245,.70)}
.space-area{border-radius:24px;padding:17px 20px;background:linear-gradient(130deg,rgba(36,36,65,.27),rgba(12,24,42,.24) 60%,rgba(13,28,31,.20))}
.space-choice{background:rgba(160,181,218,.045);color:rgba(196,210,235,.58);border-color:rgba(170,190,222,.045)}
.space-choice:hover{border-color:rgba(174,197,229,.22);color:rgba(225,234,249,.88);background:rgba(160,181,218,.07)}
.space-choice.selected{border-color:rgba(172,198,230,.27);background:rgba(137,166,205,.12);color:rgba(229,238,251,.92);box-shadow:inset 0 0 18px rgba(125,158,205,.06)}
@media(max-width:700px){.bowl-area{padding:18px 14px 15px}.space-area{padding:14px 10px}}


/* BOWLS v2.0 — each acoustic space colours the whole environment */
.ambient{transition:filter 3.2s ease,opacity 3.2s ease}
.bowl-area,.space-area,.bowl{transition:background 3.2s ease,border-color 3.2s ease,box-shadow 3.2s ease}
body.mood-chamber .ambient{filter:blur(42px) hue-rotate(-8deg) saturate(.78);opacity:.72}
body.mood-atrium .ambient{filter:blur(42px) hue-rotate(18deg) saturate(1.02);opacity:.86}
body.mood-cathedral .ambient{filter:blur(48px) hue-rotate(48deg) saturate(1.16);opacity:1}
body.mood-monument .ambient{filter:blur(54px) hue-rotate(105deg) saturate(.88) brightness(.82);opacity:.94}
body.mood-beyond .ambient{filter:blur(58px) hue-rotate(188deg) saturate(1.24) brightness(1.08);opacity:1}
body.mood-chamber .bowl-area,body.mood-chamber .space-area{background:linear-gradient(135deg,rgba(43,39,62,.27),rgba(13,22,38,.24) 58%,rgba(12,24,29,.19))}
body.mood-atrium .bowl-area,body.mood-atrium .space-area{background:linear-gradient(135deg,rgba(37,48,75,.31),rgba(16,31,51,.26) 58%,rgba(17,38,43,.20))}
body.mood-cathedral .bowl-area,body.mood-cathedral .space-area{background:linear-gradient(135deg,rgba(57,43,82,.34),rgba(24,28,57,.29) 58%,rgba(20,31,48,.22))}
body.mood-monument .bowl-area,body.mood-monument .space-area{background:linear-gradient(135deg,rgba(49,39,66,.34),rgba(18,22,39,.32) 58%,rgba(25,34,37,.25))}
body.mood-beyond .bowl-area,body.mood-beyond .space-area{background:linear-gradient(135deg,rgba(37,44,78,.37),rgba(17,26,58,.31) 58%,rgba(28,31,57,.27))}
body.mood-chamber .space-choice.selected{background:rgba(172,160,206,.13);border-color:rgba(190,178,222,.28)}
body.mood-atrium .space-choice.selected{background:rgba(133,177,206,.14);border-color:rgba(153,194,224,.30)}
body.mood-cathedral .space-choice.selected{background:rgba(166,139,207,.16);border-color:rgba(191,165,226,.32)}
body.mood-monument .space-choice.selected{background:rgba(151,139,164,.16);border-color:rgba(184,171,198,.30)}
body.mood-beyond .space-choice.selected{background:rgba(131,157,211,.17);border-color:rgba(163,186,232,.34)}


/* BOWLS v2.2 — Dronebath-style controls and slow atmospheric transitions */
.arc-control{
  --p:.5;position:relative;width:108px;height:22px;cursor:ew-resize;
  touch-action:none;outline:none;user-select:none;display:flex;align-items:center;
}
.line-track{position:relative;display:block;width:100%;height:16px}
.line-track:before{content:"";position:absolute;left:0;right:0;top:7px;height:1px;background:rgba(157,178,211,.24)}
.line-progress{position:absolute;left:0;top:7px;height:1px;width:calc(var(--p)*100%);background:rgba(164,184,222,.72);box-shadow:0 0 7px rgba(132,158,213,.25)}
.line-point{position:absolute;left:calc(var(--p)*100%);top:3px;width:9px;height:9px;border-radius:50%;background:#b9c8e4;transform:translateX(-50%);box-shadow:0 0 9px rgba(144,172,221,.48);transition:box-shadow .2s,background .2s}
.arc-control.dragging .line-point,.arc-control:focus-visible .line-point{background:#dce7fa;box-shadow:0 0 13px rgba(166,192,239,.75)}
.dial-pair{gap:clamp(18px,3vw,38px)}
.dial-wrap{gap:5px;min-width:0}
.dial-caption{font-size:7px;letter-spacing:.18em;color:rgba(190,204,228,.42)}
.dial-value{font-size:10px;line-height:1.2;color:rgba(218,228,244,.72);min-height:12px}
.timing-note{font-size:7px;line-height:1.2;letter-spacing:.04em;color:rgba(177,194,222,.38);white-space:nowrap;min-height:9px}
.bowl-area,.space-area{
  transition:background-color 12s ease,border-color 12s ease,box-shadow 12s ease;
}
.bowl-area,.space-area{position:relative;isolation:isolate}
.bowl-area:after,.space-area:after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  opacity:0;transition:opacity 5.4s cubic-bezier(.2,.7,.2,1);
}
.bowl-area>*,.space-area>*{position:relative;z-index:1}
body.mood-chamber .bowl-area:after,body.mood-chamber .space-area:after{opacity:1;background:linear-gradient(125deg,rgba(119,88,150,.12),rgba(44,50,82,.10) 58%,rgba(35,72,70,.07))}
body.mood-atrium .bowl-area:after,body.mood-atrium .space-area:after{opacity:1;background:linear-gradient(125deg,rgba(68,111,157,.15),rgba(40,68,111,.10) 58%,rgba(48,91,99,.08))}
body.mood-cathedral .bowl-area:after,body.mood-cathedral .space-area:after{opacity:1;background:linear-gradient(125deg,rgba(122,91,166,.18),rgba(67,66,125,.12) 58%,rgba(42,77,105,.08))}
body.mood-monument .bowl-area:after,body.mood-monument .space-area:after{opacity:1;background:linear-gradient(125deg,rgba(71,89,116,.15),rgba(35,57,77,.13) 58%,rgba(47,91,79,.11))}
body.mood-beyond .bowl-area:after,body.mood-beyond .space-area:after{opacity:1;background:linear-gradient(125deg,rgba(65,94,155,.18),rgba(47,60,119,.13) 58%,rgba(51,105,105,.12))}

.mood-wash{
  position:fixed;inset:-8%;z-index:0;pointer-events:none;opacity:0;
  transition:opacity 12s cubic-bezier(.18,.62,.24,1);
  filter:blur(22px);will-change:opacity;
}
.mood-wash-a,.mood-wash-b{background-size:cover;background-position:center}
.space-choice{transition:background 5s ease,border-color 5s ease,color 5s ease}
@media(max-width:700px){.arc-control{width:100px}.dial-pair{gap:20px}}
@media(max-width:390px){.arc-control{width:88px}.dial-pair{gap:14px}.timing-note{font-size:6px}}

</style>

<body>
<div class="ambient"></div><div class="mood-wash mood-wash-a"></div><div class="mood-wash mood-wash-b"></div><div class="grain"></div>
<main>
<header><div></div><div class="status" id="status"><span class="dot"></span><span id="statusText" hidden>RESTING</span></div></header>
<section class="intro"><h1>BOWLS</h1></section>
<section class="bowl-area" aria-label="Bowl instruments">
 <section class="stage" aria-label="Four singing bowls">
  <div class="bowl" data-i="0" style="--hue:270" role="button" tabindex="0" aria-label="Toggle Vesper bowl"><span class="bowl-label">VESPER</span></div>
  <div class="bowl" data-i="1" style="--hue:322" role="button" tabindex="0" aria-label="Toggle Veil bowl"><span class="bowl-label">VEIL</span></div>
  <div class="bowl" data-i="2" style="--hue:215" role="button" tabindex="0" aria-label="Toggle Tide bowl"><span class="bowl-label">TIDE</span></div>
  <div class="bowl" data-i="3" style="--hue:145" role="button" tabindex="0" aria-label="Toggle Moss bowl"><span class="bowl-label">MOSS</span></div>
 </section>
 <div class="edit-grid" aria-label="Bowl tuning">
  <div class="edit">
   <div class="dial-pair">
    <div class="dial-wrap"><div class="dial-caption">PITCH</div><div class="arc-control" role="slider" tabindex="0" aria-label="Vesper pitch" aria-valuemin="280" aria-valuemax="650" aria-valuenow="349" data-param="pitch" data-i="0" data-min="55" data-max="650" data-value="349"><span class="line-track" aria-hidden="true"><span class="line-progress"></span><i class="line-point"></i></span></div><div class="dial-value" id="pitchVal0">F4</div></div>
    <div class="dial-wrap"><div class="dial-caption">INTERVAL</div><div class="arc-control" role="slider" tabindex="0" aria-label="Vesper strike interval" aria-valuemin="4" aria-valuemax="40" aria-valuenow="12" data-param="interval" data-i="0" data-min="4" data-max="40" data-value="12"><span class="line-track" aria-hidden="true"><span class="line-progress"></span><i class="line-point"></i></span></div><div class="dial-value" id="intervalVal0">12s</div><div class="timing-note" id="intervalDesc0">Unhurried</div></div>
   </div>
  </div>

function impulse(seconds,tone=spaceTone,shape=spaceShape){
 const rate=ctx.sampleRate,length=Math.floor(rate*seconds),b=ctx.createBuffer(2,length,rate);
 for(let c=0;c<2;c++){
  const d=b.getChannelData(c);let filtered=0;

   d[i]=(filtered*envelope*.78)+early;

 wet.connect(next);

  oldReturn.gain.cancelScheduledValues(now);
  oldReturn.gain.setValueAtTime(oldReturn.gain.value,now);
  oldReturn.gain.linearRampToValueAtTime(0,now+3.8);
  nextReturn.gain.setValueAtTime(0,now);
  nextReturn.gain.linearRampToValueAtTime(1,now+3.8);
  setTimeout(()=>{try{wet.disconnect(old);old.disconnect();oldReturn.disconnect()}catch(e){}},4200);
 }
}

async function loadBowlSamples(){
 if(sampleBuffers)return sampleBuffers;
 if(samplePromise)return samplePromise;
 samplePromise=Promise.all(BOWL_CLIPS.map(async encoded=>{
  const binary=atob(encoded),bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  return ctx.decodeAudioData(bytes.buffer);
 })).then(buffers=>(sampleBuffers=buffers));
 return samplePromise;
}
function makeAudio(){
 if(ctx)return;
 ctx=new (window.AudioContext||window.webkitAudioContext)();
 master=ctx.createGain();master.gain.value=0;
 dry=ctx.createGain();wet=ctx.createGain();
 dry.connect(master);wet.connect(master);master.connect(ctx.destination);
 buildReverb(spaceDecay,false);applySpace();
}
function applySpace(){
 if(!ctx)return;
 const w=spaceWet;
 wet.gain.setTargetAtTime(w*.92,ctx.currentTime,.2);
 dry.gain.setTargetAtTime(.22+(1-w)*.65,ctx.currentTime,.2);
 master.gain.setTargetAtTime(.72,ctx.currentTime,.2);
}
function strike(i){
 if(!ctx||!running||!configs[i].active||!sampleBuffers)return;
 const c=configs[i],now=ctx.currentTime;
 const bus=ctx.createGain(),pan=ctx.createStereoPanner();
 pan.pan.value=c.pan;bus.gain.value=1;
 bus.connect(pan);pan.connect(dry);pan.connect(wet);
 const sample=ctx.createBufferSource(),sampleGain=ctx.createGain();
 sample.buffer=sampleBuffers[i];
 const naturalVariation=1+(Math.random()-.5)*.0015;
 sample.playbackRate.setValueAtTime((c.pitch/c.sourcePitch)*naturalVariation,now);
 const velocity=.88+(Math.random()*.10);
 sampleGain.gain.setValueAtTime(.0001,now);
 sampleGain.gain.linearRampToValueAtTime(velocity,now+.012);
 sampleGain.gain.setTargetAtTime(.0001,now+1.0,4.8);
 sample.connect(sampleGain);sampleGain.connect(bus);sample.start(now);
 const el=$(`.bowl[data-i="${i}"]`);
 el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit');
 setTimeout(()=>el.classList.remove('hit'),2900);
}
function schedule(i,immediate=true){
 clearTimeout(timers[i]);
 if(!running||!configs[i].active)return;
 const c=configs[i];
 if(immediate)strike(i);
 c.cycleStart=performance.now();
 const duration=c.interval*1000;
 c.nextAt=c.cycleStart+duration;
 timers[i]=setTimeout(()=>schedule(i,true),duration*(.985+Math.random()*.03));
}
function animateCharge(){
 const now=performance.now();
 configs.forEach((c,i)=>{
  const el=$(`.bowl[data-i="${i}"]`);
  if(!el)return;
  if(!running||!c.active||!c.nextAt){el.style.setProperty('--bloom','0');return;}
  const duration=Math.max(1,c.interval*1000);
  const elapsed=Math.max(0,now-c.cycleStart);
  const releaseMs=Math.min(2200,duration*.2);
  let bloom;
  if(elapsed<releaseMs){
   const t=elapsed/releaseMs;
   bloom=.18+.82*(1-(t*t*(3-2*t)));
  }else{
   const t=Math.max(0,Math.min(1,(elapsed-releaseMs)/Math.max(1,duration-releaseMs)));
   bloom=.18+.82*Math.pow(t,1.6);
  }
  el.style.setProperty('--bloom',bloom.toFixed(3));
 });
 requestAnimationFrame(animateCharge);
}
requestAnimationFrame(animateCharge);
function updateBowl(i){
 const el=$(`.bowl[data-i="${i}"]`);
 el.classList.toggle('active',configs[i].active);
 if(running&&configs[i].active)schedule(i);else clearTimeout(timers[i]);
}
async function start(){
 if(running||booting)return;
 booting=true;
 makeAudio();
 try{
  await ctx.resume();
  await loadBowlSamples();
  running=true;booting=false;
  master.gain.setTargetAtTime(.72,ctx.currentTime,.8);
  $('#status').classList.add('live');
  $('#statusText').textContent='IN THE SPACE';
  configs.forEach((c,i)=>{if(c.active)schedule(i)});
 }catch(err){
  booting=false;
  $('#statusText').textContent='AUDIO UNAVAILABLE';
  console.error(err);
 }
}
function stop(){
 running=false;timers.forEach(clearTimeout);
 if(ctx)master.gain.setTargetAtTime(0,ctx.currentTime,1.1);
 $('#status').classList.remove('live');
 $('#statusText').textContent='RESTING';
}
function toggle(i){
 configs[i].active=!configs[i].active;
 updateBowl(i);
 if(configs[i].active&&!running)start();
 if(!configs.some(c=>c.active)&&running)stop();
}
$$('.bowl').forEach(el=>{
 const i=+el.dataset.i;
 el.addEventListener('click',()=>toggle(i));
 el.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(i)}
 });
});
function setArc(control,value){
 const min=+control.dataset.min,max=+control.dataset.max,i=+control.dataset.i,p=control.dataset.param;
 const step=p==='interval'?.5:1;
 value=Math.max(min,Math.min(max,Math.round(value/step)*step));
 control.dataset.value=String(value);
 const progress=p==='pitch' ? Math.log(value/min)/Math.log(max/min) : (value-min)/(max-min);
 control.style.setProperty('--p',progress.toFixed(4));

 control.setAttribute('aria-valuenow',String(value));
 configs[i][p]=value;
 if(p==='pitch')$(`#pitchVal${i}`).textContent=noteName(value);
 else{
  const shown=value.toFixed(1).replace('.0','');
  $(`#intervalVal${i}`).textContent=shown+'s';
  const feel=value<=7?'Frequent':value<=13?'Measured':value<=21?'Unhurried':value<=30?'Sparse':'Very sparse';
  $(`#intervalDesc${i}`).textContent=feel+' · '+shown+' sec';
  if(running&&configs[i].active)schedule(i,false);
 }
}
function arcValueFromPointer(control,event){
 const r=control.getBoundingClientRect();
 const progress=Math.max(0,Math.min(1,(event.clientX-r.left)/r.width));
 const min=+control.dataset.min,max=+control.dataset.max;
 return control.dataset.param==='pitch' ? min*Math.pow(max/min,progress) : min+progress*(max-min);
}
$$('.arc-control').forEach(control=>{
 setArc(control,+control.dataset.value);
 control.addEventListener('pointerdown',e=>{control.setPointerCapture(e.pointerId);control.classList.add('dragging');setArc(control,arcValueFromPointer(control,e))});
 control.addEventListener('pointermove',e=>{if(control.hasPointerCapture(e.pointerId))setArc(control,arcValueFromPointer(control,e))});
 const release=e=>{if(control.hasPointerCapture(e.pointerId))control.releasePointerCapture(e.pointerId);control.classList.remove('dragging')};
 control.addEventListener('pointerup',release);control.addEventListener('pointercancel',release);
 control.addEventListener('keydown',e=>{
  const step=control.dataset.param==='interval'?.5:1;let v=+control.dataset.value;
  if(e.key==='ArrowUp'||e.key==='ArrowRight')v+=step;
  else if(e.key==='ArrowDown'||e.key==='ArrowLeft')v-=step;
  else if(e.key==='Home')v=+control.dataset.min;
  else if(e.key==='End')v=+control.dataset.max;
  else return;
  e.preventDefault();setArc(control,v);
 });
});

};
let activeMoodLayer=document.querySelector('.mood-wash-a');
let inactiveMoodLayer=document.querySelector('.mood-wash-b');
let moodFadeFrame=0;
function crossfadeMood(name){
 const next=MOOD_LAYERS[name];if(!next)return;
 cancelAnimationFrame(moodFadeFrame);

 // Prepare the incoming layer while it is transparent, then start both
 // opacity transitions together. This keeps the crossfade symmetrical
 // when moving either up or down through the spaces.
 inactiveMoodLayer.style.transition='none';
 inactiveMoodLayer.style.backgroundImage=next;
 inactiveMoodLayer.style.opacity='0';
 void inactiveMoodLayer.offsetWidth;
 inactiveMoodLayer.style.transition='';
 moodFadeFrame=requestAnimationFrame(()=>{
  inactiveMoodLayer.style.opacity='.82';
  activeMoodLayer.style.opacity='0';
  const previous=activeMoodLayer;
  activeMoodLayer=inactiveMoodLayer;
  inactiveMoodLayer=previous;
 });
}
crossfadeMood('chamber');
